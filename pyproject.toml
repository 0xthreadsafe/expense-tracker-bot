[project]
name = "expensebot"
version = "1.0.0"
description = "A Telegram bot for tracking personal expenses, with reports, charts and CSV export."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue,webhooks]>=21.9,<22",
    "SQLAlchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<0.22",
    "pydantic-settings>=2.7,<3",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
# Needed only when DATABASE_URL points at Postgres.
postgres = ["asyncpg>=0.30,<0.31"]

[project.scripts]
expensebot = "expensebot.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "ruff>=0.8,<0.9",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expensebot = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Entered from a button but answered with ordinary messages, which is the
    # combination this warning describes and which is intended here; the
    # reasoning is recorded at each ConversationHandler.
    "ignore:If 'per_message=False':UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The message catalogs are intentionally multilingual, and typographic
# characters such as the angle quotes used on buttons are deliberate. The
# ambiguous-unicode rules exist to catch homoglyphs smuggled into ASCII source
# and only produce false positives here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
ignore_missing_imports = true
