[project]
name = "expensebot"
version = "1.0.0"
description = "A Telegram bot for tracking personal expenses, with reports, charts and CSV export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue,webhooks]==21.9",
    "SQLAlchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "pydantic-settings==2.7.0",
    "matplotlib==3.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[project.scripts]
expensebot = "expensebot.__main__:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["expensebot"]
ignore_missing_imports = true
